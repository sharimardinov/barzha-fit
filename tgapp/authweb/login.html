<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BarzhaFit — Вход</title>
    <link rel="icon" href="/app/favi.png" type="image/png">
    <link rel="apple-touch-icon" href="/app/favi.png">
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

      :root {
        --bg: #f7f7f7;
        --white: #ffffff;
        --black: #111111;
        --muted: #888888;
        --accent: #ff033e;
        --border: rgba(0,0,0,0.06);
        --radius: 18px;
      }

      body {
        font-family: 'Aptos', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--black);
        min-height: 100vh;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        padding-top: calc(32px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      }

      .card {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      /* Logo */
      .logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .logo-img {
        width: 80px;
        height: 80px;
        border-radius: 22px;
        object-fit: contain;
        box-shadow: 0 8px 32px rgba(255,3,62,0.12);
      }
      .logo-text {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .logo-text span {
        color: var(--accent);
      }

      /* Copy */
      .copy {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .copy h1 {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
      }
      .copy p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.4;
      }

      /* Buttons */
      .actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 14px 20px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        min-height: 52px;
        font-family: inherit;
      }

      .btn-telegram {
        background: #2AABEE;
        color: #fff;
        position: relative;
      }
      .btn-telegram:hover { background: #229ED9; }
      .btn-telegram:active { transform: scale(0.98); }

      .btn-google {
        background: var(--white);
        color: var(--black);
        border: 1px solid var(--border);
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      }
      .btn-google:hover { background: #f0f0f0; }
      .btn-google:active { transform: scale(0.98); }

      /* Telegram widget overlay */
      .telegram-wrap {
        position: relative;
        width: 100%;
      }
      .telegram-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.01;
        pointer-events: auto;
        overflow: hidden;
      }
      .telegram-overlay iframe,
      .telegram-overlay > div,
      .telegram-overlay > span {
        width: 100% !important;
        height: 100% !important;
      }
      .ios .telegram-overlay {
        display: none;
      }

      /* Divider */
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        color: var(--muted);
        font-size: 12px;
      }
      .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* Footer */
      .footer {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      /* SVG icons inline */
      .icon { width: 20px; height: 20px; flex-shrink: 0; }

      /* Animate in */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .card > * {
        animation: fadeUp 0.5s ease both;
      }
      .card > *:nth-child(1) { animation-delay: 0s; }
      .card > *:nth-child(2) { animation-delay: 0.08s; }
      .card > *:nth-child(3) { animation-delay: 0.16s; }
      .card > *:nth-child(4) { animation-delay: 0.24s; }
      .card > *:nth-child(5) { animation-delay: 0.32s; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <!-- Logo -->
        <div class="logo-wrap">
          <img class="logo-img" src="/app/bott.png" alt="BarzhaFit" />
          <div class="logo-text">Barzha<span>Fit</span></div>
        </div>

        <!-- Copy -->
        <div class="copy">
          <h1>Добро пожаловать</h1>
          <p>Войди, чтобы получить доступ к плану тренировок, таймеру и питанию</p>
        </div>

        <!-- Actions -->
        <div class="actions">
          <!-- Telegram -->
          <div class="telegram-wrap">
            <a id="telegram-fallback" class="btn btn-telegram" href="/auth/telegram/start">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.2-.04-.28-.02-.12.02-2.02 1.28-5.7 3.77-.54.37-1.03.55-1.47.54-.48-.01-1.4-.27-2.09-.49-.84-.27-1.51-.42-1.45-.88.03-.24.37-.49 1.02-.74 3.99-1.74 6.65-2.89 7.99-3.45 3.8-1.6 4.59-1.88 5.1-1.89.11 0 .37.03.54.17.14.12.18.28.2.47-.01.06.01.24 0 .38z"/></svg>
              Войти через Telegram
            </a>
            <div id="telegram-login-container" class="telegram-overlay">
              <script
                async
                src="https://telegram.org/js/telegram-widget.js?22"
                data-telegram-login="authbarzhafitbot"
                data-size="large"
                data-onauth="onTelegramAuth(user)"
                data-request-access="write"
              ></script>
            </div>
          </div>

          <div class="divider">или</div>

          <!-- Google -->
          <a class="btn btn-google" href="/auth/google/start?mode=login">
            <svg class="icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Войти через Google
          </a>
        </div>

        <!-- Footer -->
        <div class="footer">
          Данные защищены и используются<br>только для работы приложения
        </div>
      </div>
    </div>

    <script>
      // iOS detection
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (isIOS) document.documentElement.classList.add("ios");

      // Fix return_to
      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get("return_to") || "/app/";
      const fallback = document.getElementById("telegram-fallback");
      if (fallback) fallback.href = "/auth/telegram/start?return_to=" + encodeURIComponent(returnTo);

      // Google btn return_to
      const googleBtn = document.querySelector(".btn-google");
      if (googleBtn) {
        const u = new URL(googleBtn.href, location.origin);
        u.searchParams.set("return_to", returnTo);
        googleBtn.href = u.toString();
      }

      // Telegram widget callback
      function onTelegramAuth(user) {
        fetch("/auth/telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        })
          .then(res => res.json())
          .then(resp => {
            if (!resp.ok) throw new Error(resp.error || "auth_failed");
            const data = resp.data || {};
            const payload = {
              token: data.token,
              userId: data.user_id,
              username: data.username,
              expiresAt: data.expires_at,
            };
            // iOS native bridge
            if (window.webkit?.messageHandlers?.authComplete) {
              window.webkit.messageHandlers.authComplete.postMessage(payload);
            } else {
              try { localStorage.setItem("auth_token", payload.token); } catch (_) {}
              setTimeout(() => { window.location.href = returnTo; }, 300);
            }
          })
          .catch(err => console.error("Auth error:", err));
      }
    </script>
  </body>
</html>

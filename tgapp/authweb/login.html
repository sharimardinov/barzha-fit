<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram Login</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f6f8;
        color: #111;
      }
      .card {
        max-width: 420px;
        margin: 0 auto;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #444;
      }
      #telegram-login-container {
        margin: 12px 0 16px;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #777;
        font-size: 12px;
        margin: 8px 0 14px;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: #e6e7ea;
        flex: 1;
      }
      .google-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #dadce0;
        background: #fff;
        color: #1f1f1f;
        font-weight: 600;
        text-decoration: none;
        width: 100%;
        box-sizing: border-box;
      }
      .google-btn:hover {
        background: #f7f7f7;
      }
      .status {
        font-size: 14px;
        color: #666;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sign in</h1>
      <p>Use Telegram or Google to continue.</p>
      <div id="telegram-login-container"></div>
      <div class="divider">or</div>
      <a class="google-btn" href="/auth/google/start?mode=login">Continue with Google</a>
      <div id="status" class="status"></div>
    </main>

    <script
      async
      src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="authbarzhafitbot"
      data-size="large"
      data-onauth="onTelegramAuth(user)"
      data-request-access="write"
    ></script>
    <script>
      const statusEl = document.getElementById("status");

      function setStatus(msg) {
        statusEl.textContent = msg || "";
      }

      function onTelegramAuth(user) {
        setStatus("Signing in...");
        fetch("/auth/telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        })
          .then((res) => res.json())
          .then((resp) => {
            if (!resp.ok) {
              throw new Error(resp.error || "auth_failed");
            }
            const data = resp.data || {};
            const payload = {
              token: data.token,
              userId: data.user_id,
              username: data.username,
              expiresAt: data.expires_at,
            };
            if (
              window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers.authComplete
            ) {
              window.webkit.messageHandlers.authComplete.postMessage(payload);
              setStatus("Success. Return to the app.");
            } else {
              console.log("Auth payload:", payload);
              setStatus("Success. You can close this page.");
            }
          })
          .catch((err) => {
            console.error("Auth error:", err);
            setStatus("Auth failed. Please try again.");
          });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff033e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BarzhaFit Login</title>
    <link rel="icon" href="/app/favi.png" type="image/png">
    <link rel="apple-touch-icon" href="/app/favi.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg: #ff033e;
        --ink: #ffffff;
        --muted: rgba(255, 255, 255, 0.78);
        --border: rgba(255, 255, 255, 0.4);
      }
      body {
        margin: 0;
        padding: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
      }
      .page {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 16px 40px;
        padding-top: calc(28px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
        position: relative;
      }
      .card {
        max-width: 520px;
        width: min(92vw, 520px);
        margin: 0 auto;
        background: transparent;
        border-radius: 0;
        padding: 28px;
        box-shadow: none;
        position: relative;
        z-index: 1;
        text-align: left;
        transform: translateY(36px);
      }
      .copy {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 40px;
        margin: 0;
        line-height: 1.05;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.2;
      }
      .actions {
        display: grid;
        gap: 12px;
        margin-bottom: 12px;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0 14px;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: var(--border);
        flex: 1;
      }
      .btn-base {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--ink);
        font-weight: 600;
        font-family: inherit;
        font-size: 15px;
        text-decoration: none;
        width: 100%;
        box-sizing: border-box;
        min-height: 52px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .btn-base:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .btn-base:active {
        transform: scale(0.98);
      }
      .telegram-btn {
        position: relative;
        width: 100%;
        min-height: 52px;
      }
      .telegram-btn .btn-face {
        width: 100%;
        position: relative;
        z-index: 1;
      }
      #telegram-login-container {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.01;
        pointer-events: auto;
      }
      #telegram-login-container iframe,
      #telegram-login-container > div,
      #telegram-login-container > span {
        width: 100% !important;
        height: 100% !important;
      }
      .ios #telegram-login-container {
        display: none;
      }
      .logo {
        width: 160px;
        height: 80px;
        margin-bottom: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: brightness(0) invert(1);
      }
      @media (max-width: 520px) {
        .card {
          padding: 22px;
          border-radius: 0;
        }
        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="card">
        <div class="logo">
          <img src="/app/bott.png" alt="BarzhaFit">
        </div>
        <div class="copy">
          <h1>Войди в меня</h1>
          <p>Один аккаунт доступ ко всему</p>
          <p>План, таймер и питание</p>
        </div>
        <div class="actions">
          <a class="google-btn btn-base" href="/auth/google/start?mode=login">Войти через Google</a>
          <div class="telegram-btn">
            <a id="telegram-fallback" class="btn-face btn-base" href="/auth/telegram/start">Войти через Telegram</a>
            <div id="telegram-login-container">
              <script
                async
                src="https://telegram.org/js/telegram-widget.js?22"
                data-telegram-login="authbarzhafitbot"
                data-size="large"
                data-onauth="onTelegramAuth(user)"
                data-request-access="write"
              ></script>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script>
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (isIOS) document.documentElement.classList.add("ios");

      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get("return_to") || "/app/";
      const fallback = document.getElementById("telegram-fallback");
      if (fallback) fallback.href = "/auth/telegram/start?return_to=" + encodeURIComponent(returnTo);

      const googleBtn = document.querySelector(".google-btn");
      if (googleBtn) {
        const u = new URL(googleBtn.href, location.origin);
        u.searchParams.set("return_to", returnTo);
        googleBtn.href = u.toString();
      }

      function onTelegramAuth(user) {
        fetch("/auth/telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        })
          .then(res => res.json())
          .then(resp => {
            if (!resp.ok) throw new Error(resp.error || "auth_failed");
            const data = resp.data || {};
            const payload = {
              token: data.token,
              userId: data.user_id,
              username: data.username,
              expiresAt: data.expires_at,
            };
            if (window.webkit?.messageHandlers?.authComplete) {
              window.webkit.messageHandlers.authComplete.postMessage(payload);
            } else {
              try { localStorage.setItem("auth_token", payload.token); } catch (_) {}
              setTimeout(() => { window.location.href = returnTo; }, 300);
            }
          })
          .catch(err => console.error("Auth error:", err));
      }
    </script>
  </body>
</html>

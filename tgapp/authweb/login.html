<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BarzhaFit Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg: #ff033e;
        --ink: #ffffff;
        --muted: rgba(255, 255, 255, 0.78);
        --border: rgba(255, 255, 255, 0.4);
      }
      body {
        margin: 0;
        padding: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 16px 40px;
        position: relative;
      }
      .card {
        max-width: 520px;
        width: min(92vw, 520px);
        margin: 0 auto;
        background: transparent;
        border-radius: 0;
        padding: 28px;
        box-shadow: none;
        position: relative;
        z-index: 1;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
        line-height: 1.1;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 15px;
      }
      #telegram-login-container {
        margin: 10px 0 6px;
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0 14px;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: var(--border);
        flex: 1;
      }
      .google-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
        width: 100%;
        box-sizing: border-box;
      }
      .google-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .status {
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
      }
      .logo {
        width: 128px;
        height: 128px;
        margin-bottom: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: brightness(0) invert(1);
      }
      @media (max-width: 520px) {
        .card {
          padding: 22px;
          border-radius: 0;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="card">
        <div class="logo">
          <img src="/miniapp/bott.png" alt="BarzhaFit">
        </div>
        <h1>Войди в меня</h1>
        <p>Один аккаунт доступ ко всему</p>
        <p>План, таймер и питание.</p>
        <a class="google-btn" href="/auth/google/start?mode=login">Войти через Google</a>
        <div id="telegram-login-container">
          <script
            async
            src="https://telegram.org/js/telegram-widget.js?22"
            data-telegram-login="authbarzhafitbot"
            data-size="large"
            data-onauth="onTelegramAuth(user)"
            data-request-access="write"
          ></script>
        </div>
        <div class="divider">или</div>
        <div id="status" class="status"></div>
      </main>
    </div>
    <script>
      const statusEl = document.getElementById("status");

      function setStatus(msg) {
        statusEl.textContent = msg || "";
      }

      function onTelegramAuth(user) {
        setStatus("Signing in...");
        fetch("/auth/telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        })
          .then((res) => res.json())
          .then((resp) => {
            if (!resp.ok) {
              throw new Error(resp.error || "auth_failed");
            }
            const data = resp.data || {};
            const payload = {
              token: data.token,
              userId: data.user_id,
              username: data.username,
              expiresAt: data.expires_at,
            };
            if (
              window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers.authComplete
            ) {
              window.webkit.messageHandlers.authComplete.postMessage(payload);
              setStatus("Success. Return to the app.");
            } else {
              try {
                localStorage.setItem("auth_token", payload.token);
              } catch (_) {
                // Ignore storage errors.
              }
              setStatus("Success. Redirecting...");
              setTimeout(() => {
                window.location.href = "/miniapp/";
              }, 400);
            }
          })
          .catch((err) => {
            console.error("Auth error:", err);
            setStatus("Auth failed. Please try again.");
          });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BarzhaFit Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-1: #f7f4f1;
        --bg-2: #f2f6ff;
        --card: #ffffff;
        --ink: #0f1216;
        --muted: #6c7280;
        --accent: #ff033e;
        --accent-2: #ff7b3a;
        --border: rgba(15, 18, 22, 0.12);
        --shadow: 0 24px 60px rgba(14, 16, 20, 0.18);
      }
      body {
        margin: 0;
        padding: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, var(--bg-2), transparent 55%),
          radial-gradient(circle at 20% 20%, #ffe6da, transparent 45%),
          linear-gradient(160deg, var(--bg-1), #fff 60%);
        color: var(--ink);
        min-height: 100vh;
      }
      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 16px 40px;
        position: relative;
        overflow: hidden;
      }
      .page::before,
      .page::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        filter: blur(0.2px);
        opacity: 0.7;
        pointer-events: none;
      }
      .page::before {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(255, 3, 62, 0.12), transparent 70%);
        top: -120px;
        right: -140px;
      }
      .page::after {
        width: 360px;
        height: 360px;
        background: radial-gradient(circle, rgba(255, 123, 58, 0.18), transparent 70%);
        bottom: -140px;
        left: -120px;
      }
      .card {
        max-width: 520px;
        width: min(92vw, 520px);
        margin: 0 auto;
        background: var(--card);
        border-radius: 24px;
        padding: 28px;
        box-shadow: var(--shadow);
        position: relative;
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(4px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
        line-height: 1.1;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 15px;
      }
      .benefits {
        display: grid;
        gap: 8px;
        margin: 0 0 18px;
        padding: 0;
        list-style: none;
        font-size: 14px;
        color: var(--ink);
      }
      .benefits li {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .benefits li::before {
        content: "•";
        color: var(--accent);
        font-size: 18px;
        line-height: 1;
      }
      #telegram-login-container {
        margin: 12px 0 16px;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        margin: 8px 0 14px;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: var(--border);
        flex: 1;
      }
      .google-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
        width: 100%;
        box-sizing: border-box;
      }
      .google-btn:hover {
        background: #f6f7f9;
      }
      .status {
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
      }
      @media (max-width: 520px) {
        .card {
          padding: 22px;
          border-radius: 20px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="card">
        <div class="brand"><span class="brand-dot"></span>BarzhaFit</div>
        <h1>Войди и продолжай тренировки</h1>
        <p>Один аккаунт — доступ ко всему: план, таймер и питание.</p>
        <ul class="benefits">
          <li>Сохраняем прогресс по каждому дню</li>
          <li>Автоплан тренировки и цели</li>
          <li>Таймер отдыха прямо в сете</li>
        </ul>
        <div id="telegram-login-container"></div>
        <div class="divider">или</div>
        <a class="google-btn" href="/auth/google/start?mode=login">Войти через Google</a>
        <div id="status" class="status"></div>
      </main>
    </div>

    <script
      async
      src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="authbarzhafitbot"
      data-size="large"
      data-onauth="onTelegramAuth(user)"
      data-request-access="write"
    ></script>
    <script>
      const statusEl = document.getElementById("status");

      function setStatus(msg) {
        statusEl.textContent = msg || "";
      }

      function onTelegramAuth(user) {
        setStatus("Signing in...");
        fetch("/auth/telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        })
          .then((res) => res.json())
          .then((resp) => {
            if (!resp.ok) {
              throw new Error(resp.error || "auth_failed");
            }
            const data = resp.data || {};
            const payload = {
              token: data.token,
              userId: data.user_id,
              username: data.username,
              expiresAt: data.expires_at,
            };
            if (
              window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers.authComplete
            ) {
              window.webkit.messageHandlers.authComplete.postMessage(payload);
              setStatus("Success. Return to the app.");
            } else {
              try {
                localStorage.setItem("auth_token", payload.token);
              } catch (_) {
                // Ignore storage errors.
              }
              setStatus("Success. Redirecting...");
              setTimeout(() => {
                window.location.href = "/miniapp/";
              }, 400);
            }
          })
          .catch((err) => {
            console.error("Auth error:", err);
            setStatus("Auth failed. Please try again.");
          });
      }
    </script>
  </body>
</html>
